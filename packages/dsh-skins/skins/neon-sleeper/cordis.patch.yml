# neon-sleeper skin bundle patch: inserts its dsh.client row into the web plugin roster.
# Install it with `dsh plugin --profile <name> add <path-or-git-url>`; mutual exclusion
# between skins is managed by scripts/dsh-skin through home-layer disabled rows.
- insert:
    - id: ui-skin-neon-sleeper
      name: '@linxin666/dsh-client-ui-skin-neon-sleeper'
