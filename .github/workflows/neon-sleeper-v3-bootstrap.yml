name: Neon Sleeper V3 bootstrap

on:
  push:
    branches:
      - feat/neon-sleeper-v3

permissions:
  contents: write

concurrency:
  group: neon-sleeper-v3-bootstrap
  cancel-in-progress: false

jobs:
  build-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feat/neon-sleeper-v3

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build and test skin
        run: |
          pnpm --filter @linxin666/dsh-client-ui-skin-neon-sleeper build
          pnpm --filter @linxin666/dsh-client-ui-skin-neon-sleeper test

      - name: Generate repositories assets
        run: |
          node scripts/skin-center-bundles
          pnpm --filter @linxin666/dsh-client-ui-skin-center build
          node scripts/gallery-build
          pnpm --filter @linxin666/dsh-skins build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Capture previews
        run: node scripts/capture-previews neon-sleeper --serve

      - name: Validate generated state
        run: |
          pnpm gallery:check
          pnpm skin-center:check
          pnpm aggregate:check
          pnpm docs:check

      - name: Commit generated artifacts
        run: |
          rm -f .github/workflows/neon-sleeper-v3-bootstrap.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(skins): generate Neon Sleeper V3 artifacts [skip ci]"
          git push origin HEAD:feat/neon-sleeper-v3
