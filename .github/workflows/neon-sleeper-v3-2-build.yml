name: Neon Sleeper V3.2 clarity pass

on:
  push:
    branches:
      - feat/neon-sleeper-v3-2-clarity

permissions:
  contents: write

concurrency:
  group: neon-sleeper-v3-2-clarity
  cancel-in-progress: false

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feat/neon-sleeper-v3-2-clarity

      - name: Apply V3.2 clarity and typography pass
        run: |
          python3 - <<'PY'
          from base64 import b64decode
          from pathlib import Path

          css = b64decode('').decode()
          test = b64decode('').decode()

          Path('packages/skins/neon-sleeper/src/client/neon-sleeper-v3-2.module.css').write_text(css)
          Path('packages/skins/neon-sleeper/tests/css-contract.spec.ts').write_text(test)

          index_path = Path('packages/skins/neon-sleeper/src/client/index.ts')
          index = index_path.read_text()
          marker = "import './neon-sleeper-v3.module.css'\n"
          next_import = "import './neon-sleeper-v3-2.module.css'\n"
          if next_import not in index:
              if index.count(marker) != 1:
                  raise SystemExit('unexpected V3 import count')
              index = index.replace(marker, marker + next_import, 1)
          index_path.write_text(index)
          PY

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build and test skin
        run: |
          pnpm --filter @linxin666/dsh-client-ui-skin-neon-sleeper build
          pnpm --filter @linxin666/dsh-client-ui-skin-neon-sleeper test

      - name: Generate repository assets
        run: |
          node scripts/skin-center-bundles
          pnpm --filter @linxin666/dsh-client-ui-skin-center build
          node scripts/gallery-build
          pnpm --filter @linxin666/dsh-skins build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Capture previews
        run: node scripts/capture-previews neon-sleeper --serve

      - name: Validate generated state
        run: |
          pnpm gallery:check
          pnpm skin-center:check
          pnpm aggregate:check
          pnpm docs:check

      - name: Upload previews
        uses: actions/upload-artifact@v4
        with:
          name: neon-sleeper-v3-2-previews
          path: packages/skins/neon-sleeper/preview

      - name: Commit V3.2 and generated artifacts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/neon-sleeper-v3-2-build.yml
          git add -A
          git commit -m "feat(skins): refine Neon Sleeper V3.2 clarity [skip ci]"
          git push origin HEAD:feat/neon-sleeper-v3-2-clarity
