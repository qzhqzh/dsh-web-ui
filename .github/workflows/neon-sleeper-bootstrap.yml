name: Neon Sleeper bootstrap

on:
  push:
    branches:
      - feat/neon-sleeper-skin

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feat/neon-sleeper-skin

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Refresh lockfile
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Build and test skin
        run: |
          pnpm --filter @linxin666/dsh-client-ui-skin-neon-sleeper build
          pnpm --filter @linxin666/dsh-client-ui-skin-neon-sleeper test

      - name: Register local skin helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/dsh-skin')
          text = path.read_text()
          marker = "  'whale-song': { pkg: '@linxin666/dsh-client-ui-skin-whale-song', id: 'ui-skin-whale-song', dir: `${REPO}/packages/skins/whale-song` },"
          row = "  'neon-sleeper': { pkg: '@linxin666/dsh-client-ui-skin-neon-sleeper', id: 'ui-skin-neon-sleeper', dir: `${REPO}/packages/skins/neon-sleeper` },"
          if row not in text:
              if marker not in text:
                  raise SystemExit('dsh-skin insertion marker not found')
              text = text.replace(marker, marker + '\n' + row)
              path.write_text(text)
          PY

      - name: Refresh bilingual record
        run: node scripts/verify-docs.mjs --write packages/skins/neon-sleeper

      - name: Generate skin center and gallery
        run: |
          node scripts/skin-center-bundles
          pnpm --filter @linxin666/dsh-client-ui-skin-center build
          node scripts/gallery-build
          pnpm --filter @linxin666/dsh-skins build

      - name: Commit generated artifacts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(skins): generate neon sleeper artifacts [skip ci]"
          git push origin HEAD:feat/neon-sleeper-skin
