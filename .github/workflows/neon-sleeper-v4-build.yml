name: Neon Sleeper V4 build

on:
  push:
    branches:
      - feat/neon-sleeper-v4-clean

permissions:
  contents: write

concurrency:
  group: neon-sleeper-v4-build
  cancel-in-progress: false

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feat/neon-sleeper-v4-clean

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies and refresh lockfile
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Build and test Neon Sleeper
        run: |
          pnpm --filter @linxin666/dsh-client-ui-skin-neon-sleeper build
          pnpm --filter @linxin666/dsh-client-ui-skin-neon-sleeper test

      - name: Generate repository assets
        run: |
          node scripts/skin-center-bundles
          pnpm --filter @linxin666/dsh-client-ui-skin-center build
          node scripts/gallery-build
          pnpm --filter @linxin666/dsh-skins build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Capture V4 previews
        run: node scripts/capture-previews neon-sleeper --serve

      - name: Validate generated state
        run: |
          pnpm gallery:check
          pnpm skin-center:check
          pnpm community:check
          pnpm aggregate:check
          pnpm docs:check

      - name: Upload V4 previews
        uses: actions/upload-artifact@v4
        with:
          name: neon-sleeper-v4-previews
          path: packages/skins/neon-sleeper/preview

      - name: Commit V4 generated artifacts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/neon-sleeper-v4-build.yml
          git add -A
          git commit -m "feat(skins): generate Neon Sleeper V4 artifacts [skip ci]"
          git push origin HEAD:feat/neon-sleeper-v4-clean
