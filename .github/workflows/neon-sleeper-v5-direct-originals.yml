name: Neon Sleeper V5 direct originals

on:
  push:
    branches:
      - feat/neon-sleeper-v5-hd

permissions:
  contents: write

concurrency:
  group: neon-sleeper-v5-direct-originals
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/neon-sleeper-v5-hd
          fetch-depth: 0

      - name: Replace fake-HD pipeline with direct light and dark originals
        run: |
          git rm -f packages/skins/neon-sleeper/src/client/art-wide-v5-part*.ts
          git rm -f packages/skins/neon-sleeper/src/client/art-portrait-part*.ts
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('packages/skins/neon-sleeper/src/client')
          old_art = (root / 'art.ts').read_text(encoding='utf-8')
          icon = re.search(r"export const NEON_SLEEPER_ICON = (.+)$", old_art, re.M)
          if not icon:
              raise SystemExit('favicon constant missing')

          (root / 'art.ts').write_text(
              "/** Theme-specific artwork for Neon Sleeper V5. The light and dark images are encoded directly from the user-supplied 1672x941 originals without resizing or super-resolution. */\n"
              "export { NEON_SLEEPER_ART_LIGHT } from './art-light-v5-direct.ts'\n"
              "export { NEON_SLEEPER_ART_DARK } from './art-dark-v5-direct.ts'\n"
              "export const NEON_SLEEPER_ART_WIDTH = 1672\n"
              "export const NEON_SLEEPER_ART_HEIGHT = 941\n"
              f"export const NEON_SLEEPER_ICON = {icon.group(1)}\n",
              encoding='utf-8',
          )

          (root / 'index.ts').write_text("""/**
           * Neon Sleeper V5 - direct-original photography-first future cabin.
           * Light and dark themes use separate user-supplied artwork with no fake HD upscaling.
           */
          import type { Context } from '@deepseek-ai/cordis'
          import {
            NEON_SLEEPER_ART_DARK,
            NEON_SLEEPER_ART_LIGHT,
            NEON_SLEEPER_ICON,
          } from './art.ts'
          import './neon-sleeper.module.css'

          const OWNED_PROPERTIES = [
            'background-color',
            '--neon-sleeper-art',
          ] as const

          export function apply(ctx: Context): void {
            const body = document.body
            const previous = new Map<string, string>()
            for (const property of OWNED_PROPERTIES) {
              previous.set(property, body.style.getPropertyValue(property))
            }

            body.dataset.dshNeonSleeper = ''

            const updateTheme = (): void => {
              const dark = body.dataset.dsDarkTheme !== undefined
              body.style.setProperty(
                '--neon-sleeper-art',
                `url(${dark ? NEON_SLEEPER_ART_DARK : NEON_SLEEPER_ART_LIGHT})`,
              )
              body.style.setProperty('background-color', dark ? '#061426' : '#dce9f1')
            }

            updateTheme()

            const observer = new MutationObserver(updateTheme)
            observer.observe(body, {
              attributes: true,
              attributeFilter: ['data-ds-dark-theme'],
            })

            const favicon = document.createElement('link')
            favicon.rel = 'icon'
            favicon.type = 'image/png'
            favicon.href = NEON_SLEEPER_ICON
            favicon.dataset.neonSleeperIcon = ''
            document.head.append(favicon)

            ctx.effect(() => () => {
              delete body.dataset.dshNeonSleeper
              observer.disconnect()
              for (const [property, value] of previous) {
                body.style.setProperty(property, value)
              }
              favicon.remove()
            }, 'ui-skin-neon-sleeper: v5 direct-original photography surface')
          }
          """.replace(/^          /gm, ''), encoding='utf-8')

          css = root / 'neon-sleeper.module.css'
          css_text = css.read_text(encoding='utf-8')
          css_text = re.sub(
              r"\nbody\[data-dsh-neon-sleeper\]\[data-ds-dark-theme\]::before \{\n\s*filter:[^}]+\}\n",
              '\n',
              css_text,
          )
          css.write_text(css_text, encoding='utf-8')
          PY

      - name: Update direct-original regression tests
        run: |
          cat > packages/skins/neon-sleeper/tests/v5-art.spec.ts <<'EOF'
          import { Buffer } from 'node:buffer'
          import { readFileSync } from 'node:fs'
          import { describe, expect, it } from 'vitest'
          import {
            NEON_SLEEPER_ART_DARK,
            NEON_SLEEPER_ART_HEIGHT,
            NEON_SLEEPER_ART_LIGHT,
            NEON_SLEEPER_ART_WIDTH,
          } from '../src/client/art.ts'

          const cssSource = readFileSync(new URL('../src/client/neon-sleeper.module.css', import.meta.url), 'utf8')

          function webpSize(dataUrl: string): [number, number] {
            const webp = Buffer.from(dataUrl.split(',', 2)[1], 'base64')
            expect(webp.length).toBeGreaterThan(200_000)
            expect(webp.subarray(0, 4).toString('ascii')).toBe('RIFF')
            expect(webp.subarray(8, 12).toString('ascii')).toBe('WEBP')
            expect(webp.subarray(12, 16).toString('ascii')).toBe('VP8 ')
            return [webp.readUInt16LE(26) & 0x3fff, webp.readUInt16LE(28) & 0x3fff]
          }

          describe('Neon Sleeper V5 direct-original visual contracts', () => {
            it('ships separate real light and dark originals without fake upscaling', () => {
              expect(NEON_SLEEPER_ART_LIGHT).not.toBe(NEON_SLEEPER_ART_DARK)
              expect(webpSize(NEON_SLEEPER_ART_LIGHT)).toEqual([1672, 941])
              expect(webpSize(NEON_SLEEPER_ART_DARK)).toEqual([1672, 941])
              expect(NEON_SLEEPER_ART_WIDTH).toBe(1672)
              expect(NEON_SLEEPER_ART_HEIGHT).toBe(941)
            })

            it('does not blur, scale, or recolor the supplied background images', () => {
              expect(cssSource).not.toMatch(/filter:[^;]*blur\(/i)
              expect(cssSource).not.toMatch(/backdrop-filter:\s*blur/i)
              expect(cssSource).not.toContain('transform: scale(')
              expect(cssSource).not.toContain('[data-ds-dark-theme]::before {\n  filter:')
              expect(cssSource).toContain('opacity: 1;')
            })
          })
          EOF

          cat > packages/skins/neon-sleeper/tests/apply.spec.ts <<'EOF'
          // @vitest-environment jsdom
          import { afterEach, describe, expect, it } from 'vitest'
          import { Context, type Fiber } from '@deepseek-ai/cordis'
          import { apply } from '../src/client/index.ts'

          let fiber: Fiber | undefined

          async function mount(): Promise<Fiber> {
            const next = new Context().plugin({ apply })
            await next.await()
            return next
          }

          async function tick(): Promise<void> {
            await new Promise((resolve) => { setTimeout(resolve, 0) })
          }

          afterEach(async () => {
            await fiber?.dispose()
            fiber = undefined
            document.head.querySelectorAll('link[data-neon-sleeper-icon]').forEach((node) => { node.remove() })
            delete document.body.dataset.dshNeonSleeper
            delete document.body.dataset.dsDarkTheme
            document.body.style.cssText = ''
          })

          describe('neon-sleeper V5 direct-original apply', () => {
            it('mounts the light original and favicon', async () => {
              fiber = await mount()
              expect(document.body.dataset.dshNeonSleeper).toBe('')
              expect(document.body.style.getPropertyValue('--neon-sleeper-art')).toContain('data:image/webp;base64')
              expect(document.head.querySelector('link[data-neon-sleeper-icon]')).not.toBeNull()
            })

            it('switches to the separate dark original without remounting', async () => {
              fiber = await mount()
              const light = document.body.style.getPropertyValue('--neon-sleeper-art')
              document.body.dataset.dsDarkTheme = ''
              await tick()
              const dark = document.body.style.getPropertyValue('--neon-sleeper-art')
              expect(dark).not.toBe(light)
              expect(document.body.style.getPropertyValue('background-color')).toBe('rgb(6, 20, 38)')
            })

            it('restores all inline state on dispose', async () => {
              document.body.style.setProperty('background-color', 'rgb(1, 2, 3)')
              document.body.style.setProperty('--neon-sleeper-art', 'prior-art')
              fiber = await mount()
              await fiber.dispose()
              fiber = undefined
              expect(document.body.dataset.dshNeonSleeper).toBeUndefined()
              expect(document.body.style.getPropertyValue('background-color')).toBe('rgb(1, 2, 3)')
              expect(document.body.style.getPropertyValue('--neon-sleeper-art')).toBe('prior-art')
              expect(document.head.querySelector('link[data-neon-sleeper-icon]')).toBeNull()
            })
          })
          EOF

      - uses: pnpm/action-setup@v5
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build and test Neon Sleeper
        run: |
          pnpm --filter @linxin666/dsh-client-ui-skin-neon-sleeper build
          pnpm --filter @linxin666/dsh-client-ui-skin-neon-sleeper test
      - name: Generate repository assets
        run: |
          node scripts/skin-center-bundles
          pnpm --filter @linxin666/dsh-client-ui-skin-center build
          node scripts/gallery-build
          pnpm --filter @linxin666/dsh-skins build
      - run: pnpm dlx playwright@1.62.1 install --with-deps chromium
      - run: node scripts/capture-previews neon-sleeper --serve
      - name: Validate generated state
        run: |
          pnpm gallery:check
          pnpm skin-center:check
          pnpm community:check
          pnpm aggregate:check
          pnpm docs:check
      - uses: actions/upload-artifact@v4
        with:
          name: neon-sleeper-v5-direct-original-previews
          path: packages/skins/neon-sleeper/preview
      - name: Commit final direct-original state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/neon-sleeper-v5-direct-originals.yml
          git add -A
          git commit -m 'fix(skins): use direct Neon Sleeper light and dark originals'
          git push origin HEAD:feat/neon-sleeper-v5-hd
