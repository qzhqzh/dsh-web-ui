name: Neon Sleeper V3.1 usability pass

on:
  push:
    branches:
      - fix/neon-sleeper-v3-1-usability

permissions:
  contents: write

concurrency:
  group: neon-sleeper-v3-1-usability
  cancel-in-progress: false

jobs:
  patch-build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: fix/neon-sleeper-v3-1-usability

      - name: Patch shell-safe glass and composer presentation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          v3_path = Path('packages/skins/neon-sleeper/src/client/neon-sleeper-v3.module.css')
          v3 = v3_path.read_text()

          replacements = [
              (
                  '  --dsw-specific-input-major: rgba(249, 252, 254, 0.80);',
                  '  --dsw-specific-input-major: rgba(249, 252, 254, 0.74);',
                  'light composer opacity',
              ),
              (
                  '  --dsw-specific-input-major: rgba(4, 19, 42, 0.72);',
                  '  --dsw-specific-input-major: rgba(4, 19, 42, 0.68);',
                  'dark composer opacity',
              ),
              (
                  "  z-index: 2;\n  pointer-events: none;\n  background-image: var(--neon-sleeper-hud-wide);",
                  "  z-index: -1;\n  pointer-events: none;\n  background-image: var(--neon-sleeper-hud-wide);",
                  'wide HUD stacking',
              ),
              (
                  "  z-index: 2;\n  pointer-events: none;\n  background-image: var(--neon-sleeper-hud-rail-left), var(--neon-sleeper-hud-rail-right);",
                  "  z-index: -1;\n  pointer-events: none;\n  background-image: var(--neon-sleeper-hud-rail-left), var(--neon-sleeper-hud-rail-right);",
                  'rail HUD stacking',
              ),
              (
                  '  opacity: 0.22;\n  filter: saturate(0.94) contrast(1.05) brightness(0.78);',
                  '  opacity: 0.14;\n  filter: saturate(0.94) contrast(1.05) brightness(0.82);',
                  'light wide HUD intensity',
              ),
              (
                  '  background-position: calc(clamp(268px, 19.4vw, 302px) - 52px) center, right -12px center;\n  background-size: clamp(74px, 7vw, 112px) 100%, clamp(74px, 7vw, 112px) 100%;',
                  '  background-position: calc(clamp(232px, 15.8vw, 286px) - 18px) center, right -14px center;\n  background-size: clamp(52px, 4vw, 68px) 100%, clamp(52px, 4vw, 68px) 100%;',
                  'desktop rail geometry',
              ),
              (
                  '  opacity: 0.20;\n  filter: saturate(0.94) brightness(0.80);',
                  '  opacity: 0.12;\n  filter: saturate(0.98) brightness(0.86);',
                  'light rail intensity',
              ),
              (
                  "body[data-dsh-neon-sleeper][data-ds-dark-theme] [id='root']::before {\n  opacity: 0.34;",
                  "body[data-dsh-neon-sleeper][data-ds-dark-theme] [id='root']::before {\n  opacity: 0.24;",
                  'dark wide HUD intensity',
              ),
              (
                  "body[data-dsh-neon-sleeper][data-ds-dark-theme] [id='root']::after {\n  opacity: 0.30;",
                  "body[data-dsh-neon-sleeper][data-ds-dark-theme] [id='root']::after {\n  opacity: 0.20;",
                  'dark rail intensity',
              ),
              (
                  '  -webkit-backdrop-filter: blur(18px) saturate(1.12);\n  backdrop-filter: blur(18px) saturate(1.12);',
                  '  -webkit-backdrop-filter: none;\n  backdrop-filter: none;',
                  'shell containing-block regression',
              ),
              (
                  "body[data-dsh-neon-sleeper] [class*='composer'],\nbody[data-dsh-neon-sleeper] [data-composer],\nbody[data-dsh-neon-sleeper] [data-phase='active'] [class*='composerSeat'] {\n  -webkit-backdrop-filter: blur(20px) saturate(1.10);\n  backdrop-filter: blur(20px) saturate(1.10);\n}\n\nbody[data-dsh-neon-sleeper] [class*='composer'] {\n  border-color: rgba(76, 157, 202, 0.28);\n  box-shadow: 0 18px 44px rgba(10, 45, 72, 0.13), inset 0 1px 0 rgba(255, 255, 255, 0.32);\n}\n\nbody[data-dsh-neon-sleeper][data-ds-dark-theme] [class*='composer'] {\n  border-color: rgba(104, 196, 239, 0.24);\n  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(133, 211, 247, 0.08);\n}\n",
                  "/* Composer layout wrappers must remain inert. The actual rounded input\n   keeps its native token-driven glass surface, while the seat stays transparent. */\nbody[data-dsh-neon-sleeper] [class*='composerSeat'] {\n  -webkit-backdrop-filter: none;\n  backdrop-filter: none;\n}\n",
                  'broad composer styling',
              ),
              (
                  "body[data-dsh-neon-sleeper][data-dsh-neon-sleeper-portrait] [id='root']::before {\n  opacity: 0.10;",
                  "body[data-dsh-neon-sleeper][data-dsh-neon-sleeper-portrait] [id='root']::before {\n  opacity: 0.07;",
                  'portrait wide HUD intensity',
              ),
              (
                  '  background-size: clamp(66px, 16vw, 98px) 100%, clamp(66px, 16vw, 98px) 100%;\n  opacity: 0.34;',
                  '  background-size: clamp(62px, 14vw, 88px) 100%, clamp(62px, 14vw, 88px) 100%;\n  opacity: 0.26;',
                  'portrait rail geometry',
              ),
              (
                  "body[data-dsh-neon-sleeper][data-ds-dark-theme][data-dsh-neon-sleeper-portrait] [id='root']::after {\n  opacity: 0.42;",
                  "body[data-dsh-neon-sleeper][data-ds-dark-theme][data-dsh-neon-sleeper-portrait] [id='root']::after {\n  opacity: 0.32;",
                  'portrait dark rail intensity',
              ),
              (
                  '    background-position: calc(clamp(224px, 31vw, 276px) - 48px) center, right -10px center;',
                  '    background-position: calc(clamp(214px, 27vw, 248px) - 16px) center, right -12px center;',
                  'narrow landscape rail geometry',
              ),
          ]

          for old, new, label in replacements:
              v3 = replace_once(v3, old, new, label)

          v3_path.write_text(v3)

          base_path = Path('packages/skins/neon-sleeper/src/client/neon-sleeper.module.css')
          base = base_path.read_text()
          base = replace_once(
              base,
              "body[data-dsh-neon-sleeper] [data-phase='active'] [class*='composerSeat'] {\n  background: transparent !important;\n}",
              "body[data-dsh-neon-sleeper] [class*='composerSeat'] {\n  background: transparent !important;\n  border-color: transparent !important;\n  box-shadow: none !important;\n}",
              'composer seat transparency',
          )
          base = replace_once(
              base,
              "body[data-dsh-neon-sleeper] [class*='session'],\nbody[data-dsh-neon-sleeper] [class*='composer'] {",
              "body[data-dsh-neon-sleeper] [class*='session'] {",
              'generic composer border selector',
          )
          base = replace_once(
              base,
              "body[data-dsh-neon-sleeper] [data-aionui-explorer-col],\nbody[data-dsh-neon-sleeper] [data-aionui-preview-col],\nbody[data-dsh-neon-sleeper] :global(.aionui-root) {",
              "body[data-dsh-neon-sleeper] [data-aionui-explorer-col],\nbody[data-dsh-neon-sleeper] [data-aionui-preview-col] {",
              'AionUI root containing block',
          )
          base_path.write_text(base)

          integrations_path = Path('packages/skins/neon-sleeper/src/client/neon-sleeper-integrations.module.css')
          integrations = integrations_path.read_text()
          integrations = replace_once(
              integrations,
              "body[data-dsh-neon-sleeper] [data-aionui-explorer-col],\nbody[data-dsh-neon-sleeper] [data-aionui-preview-col],\nbody[data-dsh-neon-sleeper] :global(.aionui-root) {",
              "body[data-dsh-neon-sleeper] [data-aionui-explorer-col],\nbody[data-dsh-neon-sleeper] [data-aionui-preview-col] {",
              'integration AionUI root containing block',
          )
          integrations_path.write_text(integrations)

          test_path = Path('packages/skins/neon-sleeper/tests/css-contract.spec.ts')
          test_path.write_text("""import { readFileSync } from 'node:fs'\nimport { describe, expect, it } from 'vitest'\n\nconst baseCss = readFileSync(new URL('../src/client/neon-sleeper.module.css', import.meta.url), 'utf8')\nconst v3Css = readFileSync(new URL('../src/client/neon-sleeper-v3.module.css', import.meta.url), 'utf8')\n\ndescribe('neon-sleeper CSS contracts', () => {\n  it('does not make shell navigation a fixed-position containing block', () => {\n    const shellRule = v3Css.match(/body\\[data-dsh-neon-sleeper\\] \\[role='navigation'\\][\\s\\S]*?\\n}/)?.[0] ?? ''\n    expect(shellRule).toContain('backdrop-filter: none')\n    expect(shellRule).not.toContain('blur(')\n  })\n\n  it('keeps the composer seat transparent without broad composer class styling', () => {\n    expect(baseCss).toContain("body[data-dsh-neon-sleeper] [class*='composerSeat']")\n    expect(baseCss).toContain('background: transparent !important')\n    expect(v3Css).not.toContain("body[data-dsh-neon-sleeper] [class*='composer'],")\n  })\n\n  it('renders decorative HUD layers behind interactive root content', () => {\n    expect((v3Css.match(/z-index: -1;/g) ?? []).length).toBeGreaterThanOrEqual(2)\n  })\n})\n""")
          PY

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build and test skin
        run: |
          pnpm --filter @linxin666/dsh-client-ui-skin-neon-sleeper build
          pnpm --filter @linxin666/dsh-client-ui-skin-neon-sleeper test

      - name: Generate repository assets
        run: |
          node scripts/skin-center-bundles
          pnpm --filter @linxin666/dsh-client-ui-skin-center build
          node scripts/gallery-build
          pnpm --filter @linxin666/dsh-skins build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Capture previews
        run: node scripts/capture-previews neon-sleeper --serve

      - name: Validate generated state
        run: |
          pnpm gallery:check
          pnpm skin-center:check
          pnpm aggregate:check
          pnpm docs:check
          pnpm no-emoji

      - name: Upload previews
        uses: actions/upload-artifact@v4
        with:
          name: neon-sleeper-v3-1-previews
          path: packages/skins/neon-sleeper/preview

      - name: Commit fixes and generated artifacts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/neon-sleeper-v3-1-usability.yml
          git add -A
          git commit -m "fix(skins): restore Neon Sleeper shell usability [skip ci]"
          git push origin HEAD:fix/neon-sleeper-v3-1-usability
