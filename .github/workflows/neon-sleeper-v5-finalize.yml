name: Neon Sleeper V5 HD finalize

on:
  push:
    branches:
      - feat/neon-sleeper-v5-hd

permissions:
  contents: write

concurrency:
  group: neon-sleeper-v5-hd-finalize
  cancel-in-progress: false

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feat/neon-sleeper-v5-hd
          fetch-depth: 0

      - name: Reconstruct original Neon Sleeper composition
        run: |
          git fetch --no-tags --depth=1 origin feat/neon-sleeper-v3-2-clarity
          git show FETCH_HEAD:packages/skins/neon-sleeper/src/client/art-wide-part0.ts > /tmp/neon-v3-wide.ts
          python3 - <<'PY'
          from pathlib import Path
          import base64, re

          text = Path('/tmp/neon-v3-wide.ts').read_text(encoding='utf-8')
          match = re.search(r"WIDE_PART_0\s*=\s*'([^']+)'", text)
          if not match:
              raise SystemExit('unable to recover original Neon Sleeper composition')
          Path('/tmp/neon-v5-source.webp').write_bytes(base64.b64decode(match.group(1)))
          PY

      - name: Install HD reconstruction tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install --disable-pip-version-check opencv-contrib-python-headless==4.10.0.84
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
          if ! curl -L --fail --retry 4 --retry-all-errors \
            https://raw.githubusercontent.com/Saafke/EDSR_Tensorflow/master/models/EDSR_x4.pb \
            -o /tmp/EDSR_x4.pb; then
            gh api \
              -H 'Accept: application/vnd.github.raw' \
              '/repos/Saafke/EDSR_Tensorflow/contents/models/EDSR_x4.pb?ref=master' \
              > /tmp/EDSR_x4.pb
          fi
          test "$(stat -c%s /tmp/EDSR_x4.pb)" -gt 30000000

      - name: Rebuild wide background with EDSR x4
        run: |
          python3 - <<'PY'
          import cv2

          source = cv2.imread('/tmp/neon-v5-source.webp', cv2.IMREAD_COLOR)
          if source is None:
              raise SystemExit('source artwork could not be decoded')
          if tuple(source.shape[1::-1]) != (864, 540):
              raise SystemExit(f'unexpected source dimensions: {source.shape[1]}x{source.shape[0]}')

          sr = cv2.dnn_superres.DnnSuperResImpl_create()
          sr.readModel('/tmp/EDSR_x4.pb')
          sr.setModel('edsr', 4)
          hd = sr.upsample(source)
          if tuple(hd.shape[1::-1]) != (3456, 2160):
              raise SystemExit(f'unexpected HD dimensions: {hd.shape[1]}x{hd.shape[0]}')
          cv2.imwrite('/tmp/neon-v5-hd.png', hd, [cv2.IMWRITE_PNG_COMPRESSION, 2])
          PY

          cwebp -quiet -q 96 -m 6 -sharp_yuv /tmp/neon-v5-hd.png -o /tmp/neon-v5-hd.webp
          ls -lh /tmp/neon-v5-source.webp /tmp/neon-v5-hd.webp

      - name: Embed HD background into source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, re

          root = Path('packages/skins/neon-sleeper/src/client')
          encoded = base64.b64encode(Path('/tmp/neon-v5-hd.webp').read_bytes()).decode('ascii')
          chunk_size = 48000
          chunks = [encoded[i:i + chunk_size] for i in range(0, len(encoded), chunk_size)]
          if len(chunks) < 4 or len(chunks) > 40:
              raise SystemExit(f'unexpected V5 artwork chunk count: {len(chunks)}')

          for old in root.glob('art-wide-v5*.ts'):
              old.unlink()
          for old in root.glob('art-wide-v4-part*.ts'):
              old.unlink()

          for index, chunk in enumerate(chunks):
              (root / f'art-wide-v5-part{index}.ts').write_text(
                  f"export const WIDE_V5_PART_{index} = '{chunk}'\n",
                  encoding='utf-8',
              )

          art = root / 'art.ts'
          text = art.read_text(encoding='utf-8')
          lines = [line for line in text.splitlines() if 'art-wide-v5' not in line and 'art-wide-v4' not in line]
          text = '\n'.join(lines) + '\n'
          marker = '/** Embedded artwork for the Neon Sleeper skin. */\n'
          imports = ''.join(
              f"import {{ WIDE_V5_PART_{i} }} from './art-wide-v5-part{i}.ts'\n"
              for i in range(len(chunks))
          )
          if marker not in text:
              raise SystemExit('art.ts marker missing')
          text = text.replace(marker, marker + imports, 1)
          expression = "export const NEON_SLEEPER_ART_WIDE = 'data:image/webp;base64,' + " + ' + '.join(
              f'WIDE_V5_PART_{i}' for i in range(len(chunks))
          )
          text, count = re.subn(r"export const NEON_SLEEPER_ART_WIDE\s*=.*", expression, text, count=1)
          if count != 1:
              raise SystemExit('unable to replace wide art export')
          text = re.sub(r'export const NEON_SLEEPER_ART_WIDE_WIDTH\s*=.*', 'export const NEON_SLEEPER_ART_WIDE_WIDTH = 3456', text)
          text = re.sub(r'export const NEON_SLEEPER_ART_WIDE_HEIGHT\s*=.*', 'export const NEON_SLEEPER_ART_WIDE_HEIGHT = 2160', text)
          art.write_text(text, encoding='utf-8')
          print(f'embedded {len(encoded)} base64 chars in {len(chunks)} chunks')
          PY

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build and test Neon Sleeper V5
        run: |
          pnpm --filter @linxin666/dsh-client-ui-skin-neon-sleeper build
          pnpm --filter @linxin666/dsh-client-ui-skin-neon-sleeper test

      - name: Generate repository assets
        run: |
          node scripts/skin-center-bundles
          pnpm --filter @linxin666/dsh-client-ui-skin-center build
          node scripts/gallery-build
          pnpm --filter @linxin666/dsh-skins build

      - name: Install Chromium
        run: pnpm dlx playwright@1.62.1 install --with-deps chromium

      - name: Capture V5 previews
        run: node scripts/capture-previews neon-sleeper --serve

      - name: Validate generated state
        run: |
          pnpm gallery:check
          pnpm skin-center:check
          pnpm community:check
          pnpm aggregate:check
          pnpm docs:check

      - name: Upload V5 previews
        uses: actions/upload-artifact@v4
        with:
          name: neon-sleeper-v5-hd-previews
          path: packages/skins/neon-sleeper/preview

      - name: Commit generated V5 assets and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/neon-sleeper-v5-finalize.yml
          git add -A
          git commit -m 'feat(skins): finalize Neon Sleeper V5 HD assets'
          git push origin HEAD:feat/neon-sleeper-v5-hd
