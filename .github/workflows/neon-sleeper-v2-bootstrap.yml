name: Neon Sleeper visual pass

on:
  push:
    branches:
      - feat/neon-sleeper-visual-pass-2

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feat/neon-sleeper-visual-pass-2

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build skin
        shell: bash
        run: |
          set +e
          pnpm --filter @linxin666/dsh-client-ui-skin-neon-sleeper build > /tmp/neon-build.log 2>&1
          code=$?
          cat /tmp/neon-build.log
          if [ "$code" -ne 0 ]; then
            msg=$(tail -c 3500 /tmp/neon-build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Neon Sleeper build failed::$msg"
            exit "$code"
          fi

      - name: Test skin
        shell: bash
        run: |
          set +e
          pnpm --filter @linxin666/dsh-client-ui-skin-neon-sleeper test > /tmp/neon-test.log 2>&1
          code=$?
          cat /tmp/neon-test.log
          if [ "$code" -ne 0 ]; then
            msg=$(tail -c 3500 /tmp/neon-test.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Neon Sleeper tests failed::$msg"
            exit "$code"
          fi

      - name: Regenerate registries and aggregate
        run: |
          node scripts/skin-center-bundles
          pnpm --filter @linxin666/dsh-client-ui-skin-center build
          node scripts/gallery-build
          pnpm --filter @linxin666/dsh-skins build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Capture Neon Sleeper previews
        run: node scripts/capture-previews neon-sleeper --serve

      - name: Verify generated state
        run: |
          pnpm gallery:check
          pnpm skin-center:check
          pnpm aggregate:check
          pnpm docs:check

      - name: Remove bootstrap workflow
        run: rm .github/workflows/neon-sleeper-v2-bootstrap.yml

      - name: Commit generated artifacts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(skins): refresh neon sleeper visual artifacts [skip ci]"
          git push origin HEAD:feat/neon-sleeper-visual-pass-2
