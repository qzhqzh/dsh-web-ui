          }

          body[data-dsh-neon-sleeper]::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 1;
            background-image: var(--neon-sleeper-art);
            background-position: right center;
            background-size: cover;
            background-repeat: no-repeat;
            image-rendering: auto;
          }

          body[data-dsh-neon-sleeper] [id='root'] {
            position: relative;
            z-index: 1;
            background: transparent;
          }

          body[data-dsh-neon-sleeper] [role='navigation'] {
            background: linear-gradient(180deg, rgba(246, 251, 255, 0.93), rgba(224, 240, 248, 0.87)) !important;
            border-right: 1px solid rgba(255, 255, 255, 0.66);
            box-shadow: 12px 0 32px rgba(12, 49, 74, 0.10);
            -webkit-backdrop-filter: none !important;
            backdrop-filter: none !important;
          }

          body[data-dsh-neon-sleeper][data-ds-dark-theme] [role='navigation'] {
            background: linear-gradient(180deg, rgba(5, 21, 44, 0.92), rgba(4, 16, 35, 0.88)) !important;
            border-right-color: rgba(128, 209, 245, 0.14);
            box-shadow: 12px 0 36px rgba(0, 5, 15, 0.34);
          }

          body[data-dsh-neon-sleeper] [role='navigation'] button,
          body[data-dsh-neon-sleeper] [role='navigation'] [role='button'] {
            border-radius: 10px;
          }

          body[data-dsh-neon-sleeper] [class*='composerSeat'],
          body[data-dsh-neon-sleeper] [data-composer-seat],
