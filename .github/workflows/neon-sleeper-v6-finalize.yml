          readme_en = """# Neon Sleeper

          English | [中文](README.zh.md)

          Neon Sleeper is a photography-first skin for the DSH Web UI. V6 uses two separate user-supplied artworks: a bright daytime future cabin for light mode and a quiet night-city sleeper cabin for dark mode.

          ## Design direction

          V6 removes the fake-HD pipeline entirely. Each 1672×941 source image is encoded once at its native dimensions and selected directly by the host theme. The application never enlarges a low-resolution intermediate, recolors the dark image, blurs the photograph, or adds a full-screen milky veil.

          - Independent 1672×941 light and dark artwork supplied by the user.
          - One native-size WebP encode per source; no EDSR or synthetic super-resolution.
          - No global blur, image scaling transform, dark-mode color filter, or full-screen scrim.
          - Clear blue-white light navigation and restrained deep-blue dark navigation.
          - Transparent composer layout wrappers, preventing a second full-width bar behind the real input.
          - Runtime theme switching through one observed body attribute, with no resize listener or network request.

          ## Install

          ```bash
          dsh-skin install neon-sleeper
          dsh-skin use neon-sleeper
          ```

          The current `scripts/dsh-skin` registry discovers the skin from `skin.json`, so no manual registry entry is required.

          ## Development

          ```bash
          pnpm --filter @linxin666/dsh-client-ui-skin-neon-sleeper build
          pnpm --filter @linxin666/dsh-client-ui-skin-neon-sleeper test
          ```

          ## Visual contract

          Both theme artworks must remain 1672×941, use independent embedded payloads, and render at opacity 1 without global blur, theme recoloring, fractional transforms, or a body-level veil. Navigation ancestors must remain blur-free so fixed submenus retain their native positioning. Composer seats must remain transparent.

          ## License

          BSD-3-Clause.
          """.replace(/^          /gm, '')

