          - 用户提供的亮色与暗色 1672×941 独立原图。
          - 每张原图只做一次原始尺寸 WebP 编码，不使用 EDSR 或合成超分辨率。
          - 不使用全局模糊、图片缩放变换、暗色滤镜或整屏遮罩。
          - 亮色侧边栏采用清透蓝白层级，暗色侧边栏采用克制深蓝层级。
