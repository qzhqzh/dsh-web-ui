name: Neon Sleeper V6 native artwork finalize

on:
  push:
    branches:
      - feat/neon-sleeper-v6-original-artwork

permissions:
  contents: write

concurrency:
  group: neon-sleeper-v6-original-artwork
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout clean V6 branch
        uses: actions/checkout@v5
        with:
          ref: feat/neon-sleeper-v6-original-artwork
          fetch-depth: 0

      - name: Restore the two user-supplied native-size artworks
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT=5552dfee827596e204468658a43cea2a2dd3c98e
          gh api "/repos/${GITHUB_REPOSITORY}/contents/.github/workflows/neon-sleeper-v5-direct-finalize.yml?ref=${SOURCE_COMMIT}" \
            --jq '.content' | tr -d '\n' | base64 -d > /tmp/source-workflow.yml

          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path('/tmp/source-workflow.yml').read_text(encoding='utf-8')
          for theme in ('LIGHT', 'DARK'):
              match = re.search(rf'{theme}_SHAS=\(\n(.*?)\n\s*\)', source, re.S)
              if match is None:
                  raise SystemExit(f'{theme} chunk list not found')
              shas = re.findall(r'\b[0-9a-f]{40}\b', match.group(1))
              if not shas:
                  raise SystemExit(f'{theme} chunk list is empty')
              Path(f'/tmp/{theme.lower()}.shas').write_text('\n'.join(shas) + '\n', encoding='utf-8')
              print(theme, len(shas), 'chunks')
          PY

          fetch_theme() {
            local theme="$1"
            : > "/tmp/${theme}.b64"
            while IFS= read -r sha; do
              gh api "/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" --jq '.content' \
                | tr -d '\n' | base64 -d >> "/tmp/${theme}.b64"
            done < "/tmp/${theme}.shas"
            base64 -d "/tmp/${theme}.b64" > "/tmp/${theme}.webp"
          }

          fetch_theme light
          fetch_theme dark

          test "$(stat -c%s /tmp/light.webp)" -eq 111584
          test "$(stat -c%s /tmp/dark.webp)" -eq 136968

          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          for theme in ('light', 'dark'):
              data = Path(f'/tmp/{theme}.webp').read_bytes()
              assert data[:4] == b'RIFF'
              assert data[8:12] == b'WEBP'
              assert data[12:16] == b'VP8 '
              width = int.from_bytes(data[26:28], 'little') & 0x3fff
              height = int.from_bytes(data[28:30], 'little') & 0x3fff
              assert (width, height) == (1672, 941), (theme, width, height)
              print(theme, len(data), width, height, hashlib.sha256(data).hexdigest())
          PY

      - name: Write V6 source, artwork modules, tests and documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import json
          import re
          import subprocess

          package_root = Path('packages/skins/neon-sleeper')
          client = package_root / 'src/client'

          old_art = (client / 'art.ts').read_text(encoding='utf-8')
          icon = re.search(r'^export const NEON_SLEEPER_ICON = (.+)$', old_art, re.M)
          if icon is None:
              raise SystemExit('favicon constant not found')

          for pattern in ('art-wide-*.ts', 'art-portrait-*.ts', 'art-light-v6-part*.ts', 'art-dark-v6-part*.ts'):
              for path in client.glob(pattern):
                  path.unlink()

          imports: list[str] = []
          expressions: dict[str, str] = {}
          for theme in ('light', 'dark'):
              encoded = base64.b64encode(Path(f'/tmp/{theme}.webp').read_bytes()).decode('ascii')
              chunks = [encoded[index:index + 60000] for index in range(0, len(encoded), 60000)]
              names: list[str] = []
              for index, chunk in enumerate(chunks):
                  symbol = f'{theme.upper()}_V6_PART_{index}'
                  names.append(symbol)
                  module = client / f'art-{theme}-v6-part{index}.ts'
                  module.write_text(f"export const {symbol} = '{chunk}'\n", encoding='utf-8')
                  imports.append(f"import {{ {symbol} }} from './{module.name}'")
              expressions[theme] = ' + '.join(names)

          (client / 'art.ts').write_text(
              '/** Neon Sleeper V6 artwork: two separate user-supplied 1672x941 originals, encoded once at native size. */\n'
              + '\n'.join(imports)
              + '\n\n'
              + "export const NEON_SLEEPER_ART_LIGHT = 'data:image/webp;base64,' + " + expressions['light'] + '\n'
              + "export const NEON_SLEEPER_ART_DARK = 'data:image/webp;base64,' + " + expressions['dark'] + '\n'
              + 'export const NEON_SLEEPER_ART_WIDTH = 1672\n'
              + 'export const NEON_SLEEPER_ART_HEIGHT = 941\n'
              + 'export const NEON_SLEEPER_ART_LIGHT_BYTES = 111584\n'
              + 'export const NEON_SLEEPER_ART_DARK_BYTES = 136968\n'
              + f'export const NEON_SLEEPER_ICON = {icon.group(1)}\n',
              encoding='utf-8',
          )

          (client / 'index.ts').write_text("""/**
           * Neon Sleeper V6 - direct light/dark original artwork.
           * Theme changes swap the source image; the skin never recolors or blurs it.
           */
          import type { Context } from '@deepseek-ai/cordis'
          import {
            NEON_SLEEPER_ART_DARK,
            NEON_SLEEPER_ART_LIGHT,
            NEON_SLEEPER_ICON,
          } from './art.ts'
          import './neon-sleeper.module.css'

          const OWNED_PROPERTIES = [
            'background-color',
            '--neon-sleeper-art',
          ] as const

          export function apply(ctx: Context): void {
            const body = document.body
            const previous = new Map<string, string>()
            for (const property of OWNED_PROPERTIES) {
              previous.set(property, body.style.getPropertyValue(property))
            }

            body.dataset.dshNeonSleeper = ''

            const updateTheme = (): void => {
              const dark = body.dataset.dsDarkTheme !== undefined
              const artwork = dark ? NEON_SLEEPER_ART_DARK : NEON_SLEEPER_ART_LIGHT
              body.style.setProperty('--neon-sleeper-art', `url(${artwork})`)
              body.style.setProperty('background-color', dark ? '#061426' : '#dce9f1')
            }

            updateTheme()

            const observer = new MutationObserver(updateTheme)
            observer.observe(body, {
              attributes: true,
              attributeFilter: ['data-ds-dark-theme'],
            })

            const favicon = document.createElement('link')
            favicon.rel = 'icon'
            favicon.type = 'image/png'
            favicon.href = NEON_SLEEPER_ICON
            favicon.dataset.neonSleeperIcon = ''
            document.head.append(favicon)

            ctx.effect(() => () => {
              delete body.dataset.dshNeonSleeper
              observer.disconnect()
              for (const [property, value] of previous) {
                body.style.setProperty(property, value)
              }
              favicon.remove()
            }, 'ui-skin-neon-sleeper: v6 direct-original photography surface')
          }
          """.replace(/^          /gm, ''), encoding='utf-8')

          (client / 'neon-sleeper.module.css').write_text("""/* Neon Sleeper V6 - native-size light/dark photography, no global veil or blur. */

