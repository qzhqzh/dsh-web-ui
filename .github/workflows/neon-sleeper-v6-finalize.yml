      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build and test Neon Sleeper V6
        run: |
          pnpm --filter @linxin666/dsh-client-ui-skin-neon-sleeper build
          pnpm --filter @linxin666/dsh-client-ui-skin-neon-sleeper test

      - name: Regenerate repository bundles
        run: |
          node scripts/skin-center-bundles
          pnpm --filter @linxin666/dsh-client-ui-skin-center build
          node scripts/gallery-build
          pnpm --filter @linxin666/dsh-skins build

      - name: Install Chromium
        run: pnpm dlx playwright@1.62.1 install --with-deps chromium

      - name: Capture light and dark previews
        run: node scripts/capture-previews neon-sleeper --serve

      - name: Validate generated state
        run: |
          pnpm gallery:check
          pnpm skin-center:check
          pnpm community:check
          pnpm aggregate:check
          pnpm docs:check
          pnpm no-emoji

      - name: Upload preview evidence
        uses: actions/upload-artifact@v4
        with:
          name: neon-sleeper-v6-original-artwork-previews
          path: packages/skins/neon-sleeper/preview

      - name: Commit clean V6 state and remove one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/neon-sleeper-v6-finalize.yml
          git add -A
          git commit -m 'feat(skins): deliver Neon Sleeper V6 native artwork'
          git push origin HEAD:feat/neon-sleeper-v6-original-artwork
