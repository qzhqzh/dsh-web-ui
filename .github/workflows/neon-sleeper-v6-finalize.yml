            --dsw-specific-selector: rgba(7, 25, 50, 0.96);
            --dsw-specific-bubble: rgba(18, 55, 88, 0.64);
            --dsw-specific-bubble-highlight: rgba(35, 79, 112, 0.72);

            --aion-bg-base: rgba(3, 15, 34, 0.06);
            --aion-bg-1: rgba(5, 20, 43, 0.11);
            --aion-bg-2: rgba(7, 25, 51, 0.18);
            --aion-bg-3: rgba(128, 209, 245, 0.10);
            --aion-bg-4: rgba(128, 209, 245, 0.17);
            --aion-bg-hover: rgba(128, 209, 245, 0.08);
            --aion-bg-active: rgba(128, 209, 245, 0.13);
            --aion-text-primary: #f1f9fd;
            --aion-text-secondary: #cadde8;
            --aion-text-tertiary: #95b3c3;
            --aion-primary: #80d1f5;
