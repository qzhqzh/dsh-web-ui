          }

          body[data-dsh-neon-sleeper] :focus-visible {
            outline: 2px solid var(--dsw-alias-state-business-primary);
            outline-offset: 2px;
          }

          body[data-dsh-neon-sleeper]::selection {
            color: #ffffff;
            background: #238bb8;
          }

          body[data-dsh-neon-sleeper][data-ds-dark-theme]::selection {
            color: #061426;
            background: #80d1f5;
          }

          @media (max-aspect-ratio: 4 / 5) {
            body[data-dsh-neon-sleeper]::before {
              background-position: 82% center;
            }

            body[data-dsh-neon-sleeper] {
              --dsw-specific-sidebar-fill: rgba(232, 243, 249, 0.92);
              --dsw-specific-input-major: rgba(249, 252, 254, 0.87);
            }

            body[data-dsh-neon-sleeper][data-ds-dark-theme] {
              --dsw-specific-sidebar-fill: rgba(4, 17, 37, 0.92);
              --dsw-specific-input-major: rgba(4, 20, 43, 0.80);
