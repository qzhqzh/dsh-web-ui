            border-color: transparent !important;
            box-shadow: none !important;
            -webkit-backdrop-filter: none !important;
            backdrop-filter: none !important;
          }

          body[data-dsh-neon-sleeper] [class*='composerSeat']::before,
          body[data-dsh-neon-sleeper] [class*='composerSeat']::after,
          body[data-dsh-neon-sleeper] [data-composer-seat]::before,
          body[data-dsh-neon-sleeper] [data-composer-seat]::after {
            content: none !important;
            background: transparent !important;
            box-shadow: none !important;
          }

          body[data-dsh-neon-sleeper] [data-composer],
          body[data-dsh-neon-sleeper] [data-composer] * {
            text-shadow: none;
          }

          body[data-dsh-neon-sleeper] a {
            color: #176f9a;
          }

          body[data-dsh-neon-sleeper][data-ds-dark-theme] a {
