          """.replace(/^          /gm, ''), encoding='utf-8')

          tests = package_root / 'tests'
          for stale in ('v4-art.spec.ts', 'v5-art.spec.ts'):
              path = tests / stale
              if path.exists():
                  path.unlink()

          (tests / 'v6-art.spec.ts').write_text("""import { Buffer } from 'node:buffer'
          import { readFileSync } from 'node:fs'
          import { describe, expect, it } from 'vitest'
          import {
            NEON_SLEEPER_ART_DARK,
            NEON_SLEEPER_ART_DARK_BYTES,
            NEON_SLEEPER_ART_HEIGHT,
            NEON_SLEEPER_ART_LIGHT,
            NEON_SLEEPER_ART_LIGHT_BYTES,
            NEON_SLEEPER_ART_WIDTH,
          } from '../src/client/art.ts'

          const css = readFileSync(new URL('../src/client/neon-sleeper.module.css', import.meta.url), 'utf8')

          function inspect(dataUrl: string, expectedBytes: number): [number, number] {
            const payload = Buffer.from(dataUrl.split(',', 2)[1], 'base64')
            expect(payload.length).toBe(expectedBytes)
            expect(payload.subarray(0, 4).toString('ascii')).toBe('RIFF')
            expect(payload.subarray(8, 12).toString('ascii')).toBe('WEBP')
            expect(payload.subarray(12, 16).toString('ascii')).toBe('VP8 ')
            return [payload.readUInt16LE(26) & 0x3fff, payload.readUInt16LE(28) & 0x3fff]
          }

          describe('Neon Sleeper V6 native artwork contract', () => {
            it('ships distinct native-size light and dark images without fake upscaling', () => {
              expect(NEON_SLEEPER_ART_LIGHT).not.toBe(NEON_SLEEPER_ART_DARK)
              expect(inspect(NEON_SLEEPER_ART_LIGHT, NEON_SLEEPER_ART_LIGHT_BYTES)).toEqual([1672, 941])
              expect(inspect(NEON_SLEEPER_ART_DARK, NEON_SLEEPER_ART_DARK_BYTES)).toEqual([1672, 941])
              expect(NEON_SLEEPER_ART_WIDTH).toBe(1672)
              expect(NEON_SLEEPER_ART_HEIGHT).toBe(941)
            })

            it('does not blur, scale, recolor, or veil the supplied photography', () => {
              expect(css).toContain('background-image: var(--neon-sleeper-art)')
              expect(css).toContain('opacity: 1')
              expect(css).not.toMatch(/filter:[^;]*blur\(/i)
              expect(css).not.toMatch(/body\[data-dsh-neon-sleeper\]\[data-ds-dark-theme\]::before\s*\{[^}]*filter:/s)
              expect(css).not.toContain('transform: scale(')
              expect(css).not.toContain('body[data-dsh-neon-sleeper]::after')
            })
          })
          """.replace(/^          /gm, ''), encoding='utf-8')

          (tests / 'apply.spec.ts').write_text("""// @vitest-environment jsdom
          import { afterEach, describe, expect, it } from 'vitest'
          import { Context, type Fiber } from '@deepseek-ai/cordis'
          import { apply } from '../src/client/index.ts'

          let fiber: Fiber | undefined

          async function mount(): Promise<Fiber> {
            const next = new Context().plugin({ apply })
            await next.await()
            return next
          }

          async function tick(): Promise<void> {
            await new Promise((resolve) => { setTimeout(resolve, 0) })
          }

          afterEach(async () => {
            await fiber?.dispose()
            fiber = undefined
            document.head.querySelectorAll('link[data-neon-sleeper-icon]').forEach((node) => { node.remove() })
            delete document.body.dataset.dshNeonSleeper
            delete document.body.dataset.dsDarkTheme
            document.body.style.cssText = ''
          })

          describe('neon-sleeper V6 apply', () => {
            it('mounts the light artwork and favicon', async () => {
              fiber = await mount()
              expect(document.body.dataset.dshNeonSleeper).toBe('')
              expect(document.body.style.getPropertyValue('--neon-sleeper-art')).toContain('data:image/webp;base64')
              expect(document.head.querySelector('link[data-neon-sleeper-icon]')).not.toBeNull()
            })

            it('switches to the independent dark artwork without remounting', async () => {
              fiber = await mount()
              const light = document.body.style.getPropertyValue('--neon-sleeper-art')
              document.body.dataset.dsDarkTheme = ''
              await tick()
              const dark = document.body.style.getPropertyValue('--neon-sleeper-art')
              expect(dark).not.toBe(light)
              expect(document.body.style.getPropertyValue('background-color')).toBe('rgb(6, 20, 38)')
            })

            it('restores all inline state on dispose', async () => {
              document.body.style.setProperty('background-color', 'rgb(1, 2, 3)')
              document.body.style.setProperty('--neon-sleeper-art', 'prior-art')
              fiber = await mount()
              await fiber.dispose()
              fiber = undefined
              expect(document.body.dataset.dshNeonSleeper).toBeUndefined()
              expect(document.body.style.getPropertyValue('background-color')).toBe('rgb(1, 2, 3)')
              expect(document.body.style.getPropertyValue('--neon-sleeper-art')).toBe('prior-art')
